version: 2

models:
  - name: stg_R_MOVIES
    description: "Movie staging table with genre and release year information"

    columns:
      - name: MOVIEID
        tests:
          - unique
          - not_null

      - name: MOVIE_NAME
        tests:
          - not_null

  - name: stg_R_RATINGS
    description: "Rating mart table"

    columns:
      - name: RATING
        tests:
          - not_null
          - positive_rating
          - test_rating

      - name : rating_date
        tests:
           - no_future_rating